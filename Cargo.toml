[package]
name = "asaas-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Non-interactive CLI for the Asaas API v3 with JSON output, built for AI agents and automation"
license = "MIT"
repository = "https://github.com/pablorobert/asaas-cli-rs"
build = "build.rs"

[lib]
name = "asaas_cli"
path = "src/lib.rs"

[[bin]]
name = "asaas"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: API responses are re-printed with their original key order.
# arbitrary_precision: numbers pass through untouched (no float64 rounding).
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"

[profile.release]
strip = true
lto = true
codegen-units = 1
